site_name: Continuum
site_description: Durable computation coordination for Java.
site_url: https://jwcarman.github.io/continuum/
repo_url: https://github.com/jwcarman/continuum
repo_name: jwcarman/continuum
edit_uri: edit/main/docs/

docs_dir: docs

# Process artifacts (specs, plans) live under docs/superpowers and stay out
# of the published site.
exclude_docs: |
  /superpowers/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Concepts:
      - The Computation Model: concepts/model.md
      - Delivery: concepts/delivery.md
      - Expiry & Retry: concepts/retry.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Pumping & Scheduling: guides/pumping.md
      - Spring Boot: guides/spring-boot.md
      - Persistence Providers: guides/persistence.md
  - Reference:
      - Changelog: https://github.com/jwcarman/continuum/blob/main/CHANGELOG.md
